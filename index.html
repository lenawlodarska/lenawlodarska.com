<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lena Włodarska</title>
  <meta name="description" content="Portfolio of Lena Włodarska: painting, graphic design, about the artist, contact.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #fefef1;   
      --ink:   #1b150d;  
      --label: #33190c;   
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--paper);
    }
    body { overflow-x: hidden; }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1919 / 943;  
    }

    .title {
      position: absolute;
      left: 9.69%;
      top: 13.57%;
      width: 80.62%;
      margin: 0;
    }
    .title img { display: block; width: 100%; height: auto; }

    .item {
      position: absolute;
      display: block;
      color: var(--label);
      text-decoration: none;
    }
    .item img {
      display: block;
      width: 100%;
      height: auto;
    }

    .item:focus-visible { outline: 3px solid var(--label); outline-offset: 6px; border-radius: 4px; }

 
    .painting { left: 5.78%;  top: 60.13%; width: 15.63%; }
    .graphic  { left: 29.55%; top: 60.87%; width: 8.55%; }
    .about    { left: 59.46%; top: 52.39%; width: 6.31%; }
    .contact  { left: 75.72%; top: 61.72%; width: 10.42%; }

    @media (max-width: 760px) {
      .stage {
        aspect-ratio: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3rem;
        padding: 2rem 1rem 4rem;
      }
      .title, .item { position: static; }
      .title { width: 100%; }

      .item { width: var(--w); }
      .painting, .graphic, .about, .contact { left: auto; top: auto; }
      .painting { --w: min(82vw, 380px); }
      .graphic  { --w: min(74vw, 340px); }
