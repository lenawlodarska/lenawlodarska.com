<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Lena Włodarska</title>
  <meta name="description" content="Contact information for Lena Włodarska.">

  <style>
    @font-face {
      font-family: 'Scanport 4';
      src: url('fonts/Scanport-4.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Scanport 1';
      src: url('fonts/Scanport-1.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --paper: #fefef1;
      --ink:   #1b150d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--paper);
    }
    body { overflow-x: hidden; }

    /* PRZYCISK GO BACK — przypięty do lewego górnego rogu okna przeglądarki z odstępem */
    .goback {
      position: fixed;
      left: 20px;       /* Odstęp od lewej krawędzi okna */
      top: 20px;        /* Odstęp od górnej krawędzi okna */
      width: 180px;     /* Stała, odpowiednia szerokość przycisku */
      display: block;
      z-index: 100;
    }
    .goback img {
      display: block;
      width: 100%;
      height: auto;
    }
    .goback:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
    }

    /* KONTENER GŁÓWNY (treść wyśrodkowana na stronie) */
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1077 / 752;
      margin: 0 auto;
      container-type: inline-size;
    }

    @media (min-width: 761px) {
      html, body { height: 100%; overflow: hidden; }
      .stage {
        width: min(100%, 100vh * (1077 / 752));
        height: min(100vh, 100vw * (752 / 1077));
      }
    }

    .content {
      position: absolute;
      left: 50%;
      top: 23%;
      transform: translateX(-50%);
      width: 62%;
      text-align: center;
    }

    .content h2 {
      margin: 0 0 0.75em 0;
      font-family: 'Scanport 4', sans-serif;
      font-size: 5.3cqw;
      font-weight: 400;
      color: var(--ink);
      text-align: center;
    }

    .content p {
      margin: 0;
      font-family: 'Scanport 1', sans-serif;
      font-size: 2.65cqw;
      line-height: 1.55;
      color: var(--ink);
      text-align: center;
    }
    .content p a {
      color: inherit;
      text-decoration: none;
    }
    .content p a:hover,
    .content p a:focus-visible {
      text-decoration: underline;
    }

    @media (max-width: 760px) {
      .stage {
        aspect-ratio: auto;
        display: block;
        padding: 0 0 4rem;
      }
      .goback {
        position: absolute;
        left: 15px;
        top: 15px;
        width: min(45vw, 160px);
      }
      .content {
        position: static;
        transform: none;
        margin-top: 100px;
        width: auto;
        padding: 0 1rem;
      }
      .content h2 { font-size: 7.5vw; }
      .content p { font-size: 5vw; }
    }
  </style>
</head>
<body>

  <!-- Przycisk umieszczony poza .stage, by nie opierał się na wyśrodkowanym kontenerze -->
  <a class="goback" href="index.html" aria-label="Go back to the main site">
    <img src="images/go back sighn.jpeg" alt="Go back">
  </a>

  <main class="stage">
    <div class="content">
      <h2>contact information:</h2>
      <p>
        phone number: <a href="tel:+48515360175">48+ 515 360 175</a><br>
        email: <a href="mailto:lena1wlodarska@gmail.com">lena1wlodarska@gmail.com</a>
      </p>
    </div>
  </main>

</body>
</html>
